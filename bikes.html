<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>車輛總覽 - 竹北榮詮管理系統</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <script src="config.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">竹北榮詮<span>管理系統</span></div>
    <div class="user">
      <button class="btn-ghost" onclick="location.href='app.html'">回系統</button>
    </div>
  </header>

  <main class="container">
    <!-- 整體統計 -->
    <section class="card">
      <h2>車輛總覽</h2>
      <div class="stats stats-4">
        <div class="stat"><div class="num" id="sBikes">-</div><div class="label">車輛總數</div></div>
        <div class="stat"><div class="num" id="sRecords">-</div><div class="label">工單總數</div></div>
        <div class="stat"><div class="num" id="sMonth">-</div><div class="label">本月工單</div></div>
        <div class="stat"><div class="num" id="sIncome">-</div><div class="label">本月營收</div></div>
      </div>
    </section>

    <!-- 排行 -->
    <div class="two-col">
      <section class="card">
        <h2>熱門維修項目</h2>
        <ol class="rank" id="topItems"></ol>
      </section>
      <section class="card">
        <h2>常見車型</h2>
        <ol class="rank" id="topModels"></ol>
      </section>
    </div>

    <!-- 全部車輛 -->
    <section class="card">
      <div class="toolbar">
        <input id="filter" placeholder="搜尋車牌、車型、車主、電話" oninput="render()">
        <select id="sort" onchange="render()">
          <option value="last">最近來店</option>
          <option value="plate">車牌</option>
          <option value="count">來店次數</option>
          <option value="km">里程</option>
        </select>
        <button class="btn-small" onclick="exportExcel()">匯出 Excel</button>
      </div>
      <p class="info" id="countText"></p>
      <ul class="list" id="bikeList"></ul>
    </section>
  </main>

  <script>
    let bikes = []; // 整理好的車輛資料

    // 小工具：建立一個元素，順便設定 class 和文字
    function el(tag, className, text) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function thisMonth() {
      return new Date().toLocaleDateString("sv-SE").slice(0, 7); // 例如 2026-11
    }

    // 一次讀出：所有車輛 + 車主 + 每台車的工單
    async function loadData() {
      const { data, error } = await db
        .from("bikes")
        .select("*, customers(name, phone), service_records(date, items, total)");
      if (error) {
        alert("讀取失敗：" + error.message);
        return;
      }

      // 幫每台車算出：來店次數、最後一次來的日期
      bikes = data.map(b => {
        const records = b.service_records || [];
        const dates = records.map(r => r.date).filter(Boolean).sort();
        return {
          id: b.id,
          plate: b.plate,
          model: b.model || "",
          owner: b.customers ? b.customers.name : "",
          phone: b.customers ? b.customers.phone || "" : "",
          mileage: b.mileage,
          count: records.length,
          last: dates.length ? dates[dates.length - 1] : "",
          records
        };
      });

      showStats();
      render();
    }

    // 上方的統計和排行
    function showStats() {
      const all = bikes.flatMap(b => b.records);
      const month = all.filter(r => r.date && r.date.startsWith(thisMonth()));
      const income = month.reduce((sum, r) => sum + (r.total || 0), 0);

      document.getElementById("sBikes").textContent = bikes.length;
      document.getElementById("sRecords").textContent = all.length;
      document.getElementById("sMonth").textContent = month.length;
      document.getElementById("sIncome").textContent = `$${income.toLocaleString()}`;

      // 熱門項目：把「換機油、齒輪油」拆成兩個項目來數
      const itemCount = {};
      all.forEach(r => {
        (r.items || "").replace(/（.*?）|\(.*?\)/g, "").split(/[、,，\/+＋\s]+/).forEach(word => {
          word = word.trim();
          if (word && word !== "（未填項目）") itemCount[word] = (itemCount[word] || 0) + 1;
        });
      });
      showRank("topItems", itemCount, "次");

      // 常見車型
      const modelCount = {};
      bikes.forEach(b => {
        if (b.model) modelCount[b.model] = (modelCount[b.model] || 0) + 1;
      });
      showRank("topModels", modelCount, "台");
    }

    // 把 { 名稱: 次數 } 排序後顯示前 5 名
    function showRank(id, counts, unit) {
      const list = document.getElementById(id);
      list.innerHTML = "";
      const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
      if (top.length === 0) {
        list.appendChild(el("li", "empty", "還沒有資料"));
        return;
      }
      const max = top[0][1];
      top.forEach(([name, n]) => {
        const li = el("li");
        const bar = el("div", "bar");
        bar.style.width = `${(n / max) * 100}%`; // 長條圖長度
        li.append(el("span", "rank-name", name), el("span", "rank-num", `${n} ${unit}`), bar);
        list.appendChild(li);
      });
    }

    // 依搜尋和排序條件，顯示車輛清單
    function render() {
      const keyword = document.getElementById("filter").value.trim().toUpperCase();
      const sort = document.getElementById("sort").value;
      const plateKey = keyword.replace(/[^A-Z0-9]/g, ""); // 車牌不管有沒有打 - 都找得到

      let list = bikes.filter(b =>
        !keyword ||
        [b.model, b.owner, b.phone].join(" ").toUpperCase().includes(keyword) ||
        (plateKey && b.plate.includes(plateKey))
      );

      if (sort === "last") list.sort((a, b) => b.last.localeCompare(a.last));
      if (sort === "plate") list.sort((a, b) => a.plate.localeCompare(b.plate));
      if (sort === "count") list.sort((a, b) => b.count - a.count);
      if (sort === "km") list.sort((a, b) => (b.mileage || 0) - (a.mileage || 0));

      document.getElementById("countText").textContent = `共 ${list.length} 台`;

      const ul = document.getElementById("bikeList");
      ul.innerHTML = "";
      if (list.length === 0) {
        ul.appendChild(el("li", "empty", "找不到符合的車輛"));
        return;
      }

      list.forEach(b => {
        const li = el("li");
        const main = el("div", "main");
        const ownerText = b.owner ? `${b.owner} ${b.phone}` : "未登記車主";
        main.append(
          el("div", "", `${b.model || "未填車型"}｜${ownerText}`),
          el("div", "sub",
            `里程 ${b.mileage ? b.mileage.toLocaleString() : "-"} 公里｜來店 ${b.count} 次｜上次 ${b.last || "-"}`)
        );

        const btn = el("button", "btn-small", "打開");
        btn.onclick = () => location.href = "app.html?plate=" + encodeURIComponent(b.plate);

        li.append(el("span", "plate", b.plate), main, btn);
        ul.appendChild(li);
      });
    }

    // 匯出全部車輛成 Excel（也可以當備份）
    function exportExcel() {
      const rows = bikes.map(b => ({
        車牌: b.plate,
        車型: b.model,
        車主: b.owner,
        電話: b.phone,
        目前里程: b.mileage || "",
        來店次數: b.count,
        上次來店: b.last
      }));
      const sheet = XLSX.utils.json_to_sheet(rows);
      const book = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(book, sheet, "車輛總覽");
      XLSX.writeFile(book, `車輛總覽_${new Date().toLocaleDateString("sv-SE")}.xlsx`);
    }

    // 沒登入就送回登入頁
    async function checkLogin() {
      const { data } = await db.auth.getSession();
      if (!data.session) {
        location.href = "index.html";
        return;
      }
      loadData();
    }

    checkLogin();
  </script>
</body>
</html>
